# Backend Python formatting and linting; frontend tooling is independent.
minimum_pre_commit_version: '3.2.0'
files: '^backend/.*\.py$'
exclude: '(^|/)[^/]*_pb2(?:_grpc)?\.py$'

default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        stages: [pre-commit]
        args: ['--filter-files', '--profile=black', '--line-length=120']

  - repo: https://github.com/psf/black
    rev: 24.4.0
    hooks:
      - id: black
        stages: [pre-commit]
        args: ['--line-length=120', '--target-version=py312']

  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        stages: [pre-commit]
        additional_dependencies: [flake8-builtins==2.1.0]
        args:
          - '--max-line-length=120'
          # Black owns line wrapping; E501 would also flag unbreakable strings.
          # A003 permits class attributes such as id without disabling F821.
          - '--extend-ignore=E203,W503,E501,A003'
          # Package re-exports are allowed; other checks still apply.
          - '--per-file-ignores=__init__.py:F401'
